# Climate-Risk Analyst Agent: custom theme configuration.
#
# Earth/climate palette: deep forest-sage primary (grounded, scientific: not a
# generic SaaS blue), warm neutral backgrounds.
# Reusable semantic status colors for risk-level badges and alerts.

[theme]
base = "light"
primaryColor = "#245E48"
backgroundColor = "#F9F8F5"
secondaryBackgroundColor = "#F0ECE4"
textColor = "#1E2621"
font = "sans-serif"
