# Climate-Risk Analyst Agent: custom theme configuration.
#
# Scientific climate risk intelligence palette:
# Warm slate/charcoal dark theme (never pitch black #000000),
# with deep forest sage primary accent and warm neutral surfaces.
# Designed with high craft to support both dark and light modes.

[theme]
base = "dark"
primaryColor = "#3E886D"
backgroundColor = "#111613"
secondaryBackgroundColor = "#1A221E"
textColor = "#ECEAE4"
font = "sans-serif"

