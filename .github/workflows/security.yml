name: security

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  workflow_dispatch:

# The audit reads the lock and talks to the advisory database; it writes nothing.
permissions:
  contents: read

jobs:
  audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          enable-cache: true
          prune-cache: true

      # A bare `uvx pip-audit` audits the environment uvx built for pip-audit
      # itself, not this project. Export the lock instead (every group, with
      # hashes, without the local project) and audit exactly those pins:
      # --require-hashes needs no resolver, so --disable-pip keeps pip out.
      - name: Export the locked dependencies
        run: uv export --frozen --all-groups --no-emit-project --format requirements.txt -o requirements-audit.txt

      # Ignored, with the reason on every line: pypdf stays at 6.14.2. pypdf
      # 6.21.4 stops on IPCC Chapter 12 page 23 at its default parsing limits,
      # and with them raised 15 of the 2,730 chunks change text, which would
      # move retrieval, the embedding cache and the eval numbers. pypdf reads
      # nothing but the three IPCC PDFs pinned by sha256 in rag/corpus.py,
      # checked on download and again right before parsing, and every advisory
      # below needs an attacker-crafted PDF ("An attacker who uses this
      # vulnerability can craft a PDF which leads to ..."). Delete an entry as
      # soon as pypdf moves past its fix.
      - name: Run pip-audit on the lock
        run: |
          ignored=(
            CVE-2026-113786  # pypdf, fixed in 6.21.1: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-113789  # pypdf, fixed in 6.21.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-113790  # pypdf, fixed in 6.21.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-113791  # pypdf, fixed in 6.21.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-113792  # pypdf, fixed in 6.20.1: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-113793  # pypdf, fixed in 6.20.1: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-113794  # pypdf, fixed in 6.20.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-113795  # pypdf, fixed in 6.20.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-115572  # pypdf, fixed in 6.21.2: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-115580  # pypdf, fixed in 6.21.2: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-115585  # pypdf, fixed in 6.21.2: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-119203  # pypdf, fixed in 6.21.4: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-119204  # pypdf, fixed in 6.21.4: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-119205  # pypdf, fixed in 6.21.4: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-119206  # pypdf, fixed in 6.21.3: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-119207  # pypdf, fixed in 6.21.3: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-119208  # pypdf, fixed in 6.21.3: needs a crafted PDF; input is the pinned IPCC PDFs only
            CVE-2026-119209  # pypdf, fixed in 6.21.3: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-3655  # pypdf, fixed in 6.15.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-3656  # pypdf, fixed in 6.15.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-3910  # pypdf, fixed in 6.16.1: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-3911  # pypdf, fixed in 6.16.1: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-3912  # pypdf, fixed in 6.15.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-3913  # pypdf, fixed in 6.16.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-4153  # pypdf, fixed in 6.18.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-4154  # pypdf, fixed in 6.18.1: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-4155  # pypdf, fixed in 6.18.1: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-4156  # pypdf, fixed in 6.18.1: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-4157  # pypdf, fixed in 6.19.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-4158  # pypdf, fixed in 6.17.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-4159  # pypdf, fixed in 6.19.0: needs a crafted PDF; input is the pinned IPCC PDFs only
            PYSEC-2026-4160  # pypdf, fixed in 6.19.0: needs a crafted PDF; input is the pinned IPCC PDFs only
          )
          uvx --from pip-audit==2.10.1 pip-audit --strict --require-hashes --disable-pip -r requirements-audit.txt "${ignored[@]/#/--ignore-vuln=}"
